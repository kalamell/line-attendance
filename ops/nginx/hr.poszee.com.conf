# vhost for the SHARED nginx on 167.99.66.6 (/var/data/nginx/hr.poszee.com.conf).
#   /api  -> poszee-api:3000   (NestJS)
#   /     -> poszee-web:80      (console SPA; LIFF under /liff/)
# Behind Cloudflare (proxied), CF SSL "Full" accepts the self-signed origin cert.
# ALWAYS `docker exec nginx nginx -t` before reload — shared with ~10 sites.

server {
    listen 80;
    listen [::]:80;
    server_name hr.poszee.com;

    location /.well-known/acme-challenge/ { root /usr/share/nginx/html/letsencrypt; }

    location /api/ {
        proxy_pass http://poszee-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://poszee-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hr.poszee.com;

    ssl_certificate     /etc/nginx/ssl/selfsigned/hr.poszee.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/selfsigned/hr.poszee.com/privkey.pem;

    location /api/ {
        proxy_pass http://poszee-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://poszee-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
