# vhost for the SHARED nginx on 167.99.66.6 (/var/data/nginx/hr.poszee.com.conf).
# Routes hr.poszee.com -> poszee-api:3000 over the data_default network.
# Behind Cloudflare: set the CF DNS record (proxied) to origin 167.99.66.6.
#   - CF SSL "Full (strict)": install a CF Origin Certificate and enable the 443 block below.
#   - CF SSL "Flexible": the :80 block alone is enough (CF terminates TLS at the edge).
#
# ALWAYS `docker exec nginx nginx -t` before reloading — this file shares the
# proxy with ~10 other production sites.

server {
    listen 80;
    listen [::]:80;
    server_name hr.poszee.com;

    # Let's Encrypt / certbot webroot (shared certbot container)
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html/letsencrypt;
    }

    location / {
        proxy_pass http://poszee-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

