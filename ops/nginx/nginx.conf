worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  sendfile      on;
  server_tokens off;

  upstream api { server api:3000; }

  # Redirect http -> https
  server {
    listen 80;
    server_name hr.poszee.com *.poszee.com;
    return 301 https://$host$request_uri;
  }

  # Platform console (super admin + HR) at hr.poszee.com
  server {
    listen 443 ssl;
    server_name hr.poszee.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location /api/ { proxy_pass http://api; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }

    # built console SPA (apps/console) mounted here in production
    root /srv/console;
    location / { try_files $uri /index.html; }
  }

  # Tenant workspaces at <sub>.poszee.com — LIFF app + tenant-scoped API.
  # nginx passes Host through; the API's TenantMiddleware resolves the tenant from the subdomain.
  server {
    listen 443 ssl;
    server_name ~^(?<sub>[^.]+)\.poszee\.com$;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;      # wildcard *.poszee.com
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location /api/ {
      proxy_pass http://api;
      proxy_set_header Host $host;              # keeps <sub>.poszee.com for tenant resolution
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    # built LIFF SPA (apps/liff)
    root /srv/liff;
    location / { try_files $uri /index.html; }
  }
}
