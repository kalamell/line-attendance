server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # LIFF SPA (built with base /liff/)
    location /liff/ {
        try_files $uri $uri/ /liff/index.html;
    }

    # console SPA (super admin + HR) at root
    location / {
        try_files $uri $uri/ /index.html;
    }
}
